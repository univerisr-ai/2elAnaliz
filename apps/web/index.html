    <meta name="twitter:image" content="https://www.gpupusula.shop/favicon.svg" />
    <script id="site-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GPU Pusula",
        "url": "https://www.gpupusula.shop/",
        "inLanguage": "tr-TR",
        "description": "İkinci el ekran kartı ilanlarını model, fiyat ve alınabilirlik skoruyla karşılaştıran GPU katalog aracı."
      }
    </script>
    <title>İkinci El Ekran Kartı Fiyatları ve GPU İlanları | GPU Pusula</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("gp-theme");
          if (theme !== "dark" && theme !== "light") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#131318" : "#f6f8fc");
          window.__gpBootAt = Date.now();
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-loader" id="boot-loader" aria-label="GPU Pusula yükleniyor">
      <style>
        .boot-loader {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #f6f4f8;
          font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
          transition: clip-path 480ms cubic-bezier(0.22, 1, 0.36, 1), opacity 420ms ease;
          clip-path: inset(0 0 0 0);
        }

        /* Perde kalkışı: açılış ekranı yukarı sıyrılarak uygulamayı açığa çıkarır */
        .boot-loader--away {
          clip-path: inset(0 0 100% 0);
          opacity: 0.99;
          pointer-events: none;
        }

        .boot-loader--away .boot-loader__chips,
        .boot-loader--away .boot-loader__text {
          opacity: 0;
          transform: translateY(-10px);
          transition: opacity 240ms ease, transform 300ms ease;
        }

        .boot-loader__chips {
          display: flex;
          align-items: flex-end;
          gap: 4px;
          height: 64px;
        }

        .boot-loader__chip {
          border-radius: 999px 999px 0 0;
          transform-origin: bottom center;
          animation: boot-bounce 1.1s ease-in-out infinite;
        }

        .boot-loader__chip--nvidia { width: 26px; height: 58px; background: #79bd30; }
        .boot-loader__chip--amd { width: 34px; height: 40px; background: #e8544a; animation-delay: 0.15s; }
        .boot-loader__chip--intel { width: 22px; height: 26px; background: #3b82d6; animation-delay: 0.3s; }

        .boot-loader__text {
          color: #6b7280;
          font-size: 13px;
          letter-spacing: 0.04em;
        }

        @keyframes boot-bounce {
          0%, 100% { transform: scaleY(1); }
          40% { transform: scaleY(0.82); }
          65% { transform: scaleY(1.06); }
        }

        @media (prefers-reduced-motion: reduce) {
          .boot-loader__chip { animation: none; }

          .boot-loader {
            transition: opacity 200ms ease;
            clip-path: none;
          }

          .boot-loader--away {
            opacity: 0;
          }
        }

        :root[data-theme="dark"] .boot-loader {
          background: #131318;
        }

        :root[data-theme="dark"] .boot-loader__text {
          color: #a9aeb9;
        }
      </style>
      <div class="boot-loader__chips" aria-hidden="true">
        <span class="boot-loader__chip boot-loader__chip--nvidia"></span>
        <span class="boot-loader__chip boot-loader__chip--amd"></span>
        <span class="boot-loader__chip boot-loader__chip--intel"></span>
      </div>
      <span class="boot-loader__text">GPU Pusula açılıyor…</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
