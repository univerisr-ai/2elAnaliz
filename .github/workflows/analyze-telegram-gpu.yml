name: Vercel Dashboard Analyzer

on:
  repository_dispatch:
    types: [telegram_file_ready]
  workflow_dispatch:
  schedule:
    # Refresh market price references from the latest scraper artifact every 6 hours.
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download scraper artifact
        id: scraper_artifact
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          DISPATCH_RUN_ID: ${{ github.event.client_payload.github_run_id }}
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          DISPATCH_ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name }}
          DEFAULT_SOURCE_REPOSITORY: ${{ vars.SCRAPER_SOURCE_REPOSITORY }}
          LETGO_SOURCE_REPOSITORY: ${{ vars.LETGO_SOURCE_REPOSITORY }}
          DOLAP_SOURCE_REPOSITORY: ${{ vars.DOLAP_SOURCE_REPOSITORY }}
          DONANIMHABER_SOURCE_REPOSITORY: ${{ vars.DONANIMHABER_SOURCE_REPOSITORY }}
          FACEBOOK_SOURCE_REPOSITORY: ${{ vars.FACEBOOK_SOURCE_REPOSITORY }}
          FORUM_SOURCE_REPOSITORY: ${{ vars.FORUM_SOURCE_REPOSITORY }}
          TECHNOPAT_SOURCE_REPOSITORY: ${{ vars.TECHNOPAT_SOURCE_REPOSITORY }}
          TECHOLAY_SOURCE_REPOSITORY: ${{ vars.TECHOLAY_SOURCE_REPOSITORY }}
          DOLAP_MIN_LISTINGS: ${{ vars.DOLAP_MIN_LISTINGS }}
          SAHIBINDEN_MIN_LISTINGS: ${{ vars.SAHIBINDEN_MIN_LISTINGS }}
          SAHIBINDEN_SCRAPER_WORKFLOW: ${{ vars.SAHIBINDEN_SCRAPER_WORKFLOW }}
        run: |
          set -euo pipefail
          rm -rf ./data/inbox ./data/sources
          mkdir -p ./data/inbox
          mkdir -p ./data/sources

          DEFAULT_REPO="${DEFAULT_SOURCE_REPOSITORY:-univerisr-ai/ahibinden-ekran-karti}"
          LETGO_REPO="${LETGO_SOURCE_REPOSITORY:-univerisr-ai/letgo-ekran-karti}"
          DOLAP_REPO="${DOLAP_SOURCE_REPOSITORY:-univerisr-ai/dolap-ekran-kart-}"
          DONANIMHABER_REPO="${DONANIMHABER_SOURCE_REPOSITORY:-univerisr-ai/donanimhaber-ekran-karti}"
          FORUM_REPO="${FORUM_SOURCE_REPOSITORY:-${FACEBOOK_SOURCE_REPOSITORY:-univerisr-ai/facebook-ekran-kart-}}"
          TECHNOPAT_REPO="${TECHNOPAT_SOURCE_REPOSITORY:-}"
          TECHOLAY_REPO="${TECHOLAY_SOURCE_REPOSITORY:-}"
          DOLAP_MIN_LISTINGS="${DOLAP_MIN_LISTINGS:-50}"
          SAHIBINDEN_MIN_LISTINGS="${SAHIBINDEN_MIN_LISTINGS:-200}"
          SAHIBINDEN_SCRAPER_WORKFLOW="${SAHIBINDEN_SCRAPER_WORKFLOW:-sahibinden_bot.yml}"
          export DOLAP_MIN_LISTINGS SAHIBINDEN_MIN_LISTINGS

          sanitize_repo() {
            printf '%s' "$1" | tr '/:' '__'
          }

          write_metadata() {
            local dir="$1"
            local repo="$2"
            local run_id="$3"
            local artifact_name="$4"

            cat > "${dir}/metadata.json" <<JSON
          {
            "source_repository": "${repo}",
            "scraper_run_id": "${run_id}",
            "scraper_run_url": "https://github.com/${repo}/actions/runs/${run_id}",
            "artifact_name": "${artifact_name}"
          }
          JSON
          }

          download_specific_artifact() {
            local repo="$1"
            local run_id="$2"
            local artifact_name="$3"
            local dir="$4"
            local min_listings="${5:-1}"

            mkdir -p "$dir"
            echo "Dispatch artifact indiriliyor: repo=${repo}, run=${run_id}, artifact=${artifact_name}"
            gh run download "${run_id}" \
              --repo "${repo}" \
              --name "${artifact_name}" \
              --dir "${dir}"

            local listing_count
            listing_count="$(count_artifact_listings "${dir}")"
            if [ "${listing_count}" -lt "${min_listings}" ]; then
              echo "Dispatch artifact atlandi: repo=${repo}, run=${run_id}, listings=${listing_count}, min=${min_listings}" >&2
              rm -rf "${dir}"
              return 1
            fi

            write_metadata "$dir" "$repo" "$run_id" "$artifact_name"
          }

          count_artifact_listings() {
            local dir="$1"
            node -e "const fs=require('fs'); const p='${dir}/output.json'; if(!fs.existsSync(p)){console.log(0); process.exit(0)} const j=JSON.parse(fs.readFileSync(p,'utf8')); console.log(Number(j.totalClean ?? j.runMeta?.listingCount ?? j.allListings?.length ?? 0) || 0)"
          }

          min_listings_for_repo() {
            local repo="$1"
            if [ "${repo}" = "${DEFAULT_REPO}" ]; then
              echo "${SAHIBINDEN_MIN_LISTINGS}"
            elif [ "${repo}" = "${DOLAP_REPO}" ]; then
              echo "${DOLAP_MIN_LISTINGS}"
            else
              echo "1"
            fi
          }

          workflow_for_repo() {
            local repo="$1"
            if [ "${repo}" = "${DEFAULT_REPO}" ]; then
              echo "${SAHIBINDEN_SCRAPER_WORKFLOW}"
            else
              echo ""
            fi
          }

          download_latest_artifact() {
            local repo="$1"
            local dir="$2"
            local min_listings="${3:-1}"
            local workflow_name="${4:-}"

            rm -rf "$dir"
            mkdir -p "$dir"
            echo "${repo} icindeki son basarili scraper artifact'i aranacak."
            RUN_LIST_ARGS=(run list --repo "${repo}" --status success --limit 50 --json databaseId)
            if [ -n "${workflow_name}" ]; then
              RUN_LIST_ARGS+=(--workflow "${workflow_name}")
              echo "Workflow filtresi: ${workflow_name}"
            fi

            mapfile -t RUN_IDS < <(
              gh "${RUN_LIST_ARGS[@]}" \
                --jq '.[].databaseId'
            )

            for RUN_ID in "${RUN_IDS[@]}"; do
              local artifact_name="scraper-results-${RUN_ID}"
              local temp_dir="${dir}.tmp-${RUN_ID}"
              echo "Deneniyor: repo=${repo}, run=${RUN_ID}, artifact=${artifact_name}"
              rm -rf "${temp_dir}"
              mkdir -p "${temp_dir}"
              if gh run download "${RUN_ID}" \
                --repo "${repo}" \
                --name "${artifact_name}" \
                --dir "${temp_dir}"; then
                local listing_count
                listing_count="$(count_artifact_listings "${temp_dir}")"
                if [ "${listing_count}" -lt "${min_listings}" ]; then
                  echo "Artifact atlandi: repo=${repo}, run=${RUN_ID}, listings=${listing_count}, min=${min_listings}" >&2
                  rm -rf "${temp_dir}"
                  continue
                fi
                rm -rf "${dir}"
                mv "${temp_dir}" "${dir}"
                write_metadata "$dir" "$repo" "$RUN_ID" "$artifact_name"
                return 0
              fi
              rm -rf "${temp_dir}"
            done

            return 1
          }

          DOWNLOADED=0
          DISPATCH_SOURCE_ACCEPTED=""

          if [ -n "${DISPATCH_RUN_ID:-}" ]; then
            SCRAPER_RUN_ID="${DISPATCH_RUN_ID}"
            ARTIFACT_NAME="${DISPATCH_ARTIFACT_NAME:-scraper-results-${DISPATCH_RUN_ID}}"
            SOURCE_REPO="${DISPATCH_SOURCE_REPOSITORY:-${DEFAULT_REPO}}"
            SOURCE_DIR="./data/sources/dispatch-$(sanitize_repo "${SOURCE_REPO}")"
            MIN_LISTINGS="$(min_listings_for_repo "${SOURCE_REPO}")"
            if download_specific_artifact "${SOURCE_REPO}" "${SCRAPER_RUN_ID}" "${ARTIFACT_NAME}" "${SOURCE_DIR}" "${MIN_LISTINGS}"; then
              DOWNLOADED=$((DOWNLOADED + 1))
              DISPATCH_SOURCE_ACCEPTED="${SOURCE_REPO}"
            else
              echo "Uyari: dispatch artifact kalite/minimum ilan esigini gecemedi; latest scraper artifact aranacak." >&2
            fi
          fi

          declare -A SEEN_REPOS=()
          for SOURCE_REPO in "${DEFAULT_REPO}" "${LETGO_REPO}" "${DOLAP_REPO}" "${DONANIMHABER_REPO}" "${FORUM_REPO}" "${TECHNOPAT_REPO}" "${TECHOLAY_REPO}"; do
            if [ -z "${SOURCE_REPO:-}" ]; then
              continue
            fi

            if [ -n "${SEEN_REPOS[$SOURCE_REPO]:-}" ]; then
              echo "Kaynak repo zaten denendi, atlandi: ${SOURCE_REPO}"
              continue
            fi
            SEEN_REPOS[$SOURCE_REPO]=1

            if [ -n "${DISPATCH_SOURCE_ACCEPTED:-}" ] && [ "${SOURCE_REPO}" = "${DISPATCH_SOURCE_ACCEPTED}" ]; then
              echo "Dispatch kaynagi zaten indirildi, atlandi: ${SOURCE_REPO}"
              continue
            fi

            SOURCE_DIR="./data/sources/$(sanitize_repo "${SOURCE_REPO}")"
            MIN_LISTINGS="$(min_listings_for_repo "${SOURCE_REPO}")"
            WORKFLOW_FILTER="$(workflow_for_repo "${SOURCE_REPO}")"

            if download_latest_artifact "${SOURCE_REPO}" "${SOURCE_DIR}" "${MIN_LISTINGS}" "${WORKFLOW_FILTER}"; then
              DOWNLOADED=$((DOWNLOADED + 1))
            else
              echo "Uyari: ${SOURCE_REPO} icin indirilebilir scraper artifact'i bulunamadi." >&2
            fi
          done

          if [ "${DOWNLOADED}" -eq 0 ]; then
            echo "Hiç scraper artifact'i indirilemedi; bos katalog deploy etmemek icin workflow durduruluyor." >&2
            exit 1
          fi

          node scripts/merge-scraper-outputs.mjs ./data/sources ./data/inbox/output.json ./data/inbox/pipeline-messages.json

          if [ ! -s ./data/inbox/output.json ]; then
            echo "Merge tamamlandi ama output.json yok veya bos; bos katalog deploy etmemek icin workflow durduruluyor." >&2
            exit 1
          fi

          MERGE_LISTING_COUNT="$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('./data/inbox/output.json','utf8')); console.log(j.totalClean || j.runMeta?.listingCount || 0)")"
          MERGE_SCRAPE_STATUS="$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('./data/inbox/output.json','utf8')); console.log(j.runMeta?.scrapeStatus || 'SCRAPE_COMPLETED')")"

          {
            echo "source_repository=multi-source"
            echo "scraper_run_id=${DISPATCH_RUN_ID:-latest}"
            echo "scraper_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "artifact_name=merged-scraper-results"
            echo "listing_count=${MERGE_LISTING_COUNT}"
            echo "scrape_status=${MERGE_SCRAPE_STATUS}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare fallback inbox files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./data/inbox

          if [ ! -f ./data/inbox/output.json ]; then
            echo "output.json bulunamadi; bos katalog deploy etmemek icin workflow durduruluyor." >&2
            exit 1
          fi

          if [ ! -f ./data/inbox/pipeline-messages.json ]; then
            cat > ./data/inbox/pipeline-messages.json <<'JSON'
          [
            {
              "service": "scraper",
              "status": "ANALIZ_EDILMEDI",
              "message": "Scraper veriyi hazirladi; analyzer bu dosyayi dashboard icin isleyecek.",
              "timestamp": "1970-01-01T00:00:00.000Z"
            }
          ]
          JSON
          fi

      - name: Build sanitized dashboard package
        shell: bash
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          MAX_AI_FALLBACK_MODELS: ${{ vars.MAX_AI_FALLBACK_MODELS }}
          MAX_AI_MODEL_LOOKUPS: ${{ vars.MAX_AI_MODEL_LOOKUPS }}
          MAX_WEB_MODEL_LOOKUPS: ${{ vars.MAX_WEB_MODEL_LOOKUPS }}
          MIN_DISCOUNT_RATIO: ${{ vars.MIN_DISCOUNT_RATIO }}
          MAX_RESULTS: ${{ vars.MAX_RESULTS }}
          DEPLOY_TARGET: vercel
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          SCRAPER_SOURCE_REPOSITORY: ${{ steps.scraper_artifact.outputs.source_repository || github.event.client_payload.source_repository }}
          SCRAPER_RUN_URL: ${{ steps.scraper_artifact.outputs.scraper_run_url || github.event.client_payload.source_run_url }}
          SCRAPER_GITHUB_RUN_ID: ${{ steps.scraper_artifact.outputs.scraper_run_id || github.event.client_payload.github_run_id }}
          SCRAPER_ARTIFACT_NAME: ${{ steps.scraper_artifact.outputs.artifact_name || github.event.client_payload.artifact_name }}
          SCRAPER_STATUS: ${{ steps.scraper_artifact.outputs.scrape_status || github.event.client_payload.scrape_status }}
          SCRAPER_LISTING_COUNT: ${{ steps.scraper_artifact.outputs.listing_count || github.event.client_payload.listing_count }}
          SCRAPER_STARTED_AT: ${{ github.event.client_payload.started_at }}
          SCRAPER_FINISHED_AT: ${{ github.event.client_payload.finished_at }}
          SCRAPER_PIPELINE_MESSAGE: ${{ github.event.client_payload.pipeline_message }}
          SCRAPER_IS_FALLBACK: ${{ github.event.client_payload.is_fallback }}
        run: |
          set -o pipefail
          node src/local-index.mjs ./data/inbox/output.json 2>&1 | tee analyzer.log
          node scripts/prepare-api-dashboard-cache.mjs ./data/inbox/output.json

      - name: Upload sanitized summary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-summary-${{ github.run_id }}
          path: |
            docs/latest-summary.json
          retention-days: 7

      - name: Deploy dashboard to Vercel
        if: success()
        id: vercel_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Vercel deployment skipped: token/org/project id missing." >&2
            exit 1
          fi

          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          DEPLOY_URL="$(vercel deploy --prod --token="$VERCEL_TOKEN" --yes)"

          echo "dashboard_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DEPLOY_URL" > dashboard-url.txt

      - name: Upload dashboard url artifact
        if: success() && steps.vercel_deploy.outputs.dashboard_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-url-${{ github.run_id }}
          path: |
            dashboard-url.txt
          retention-days: 7

      - name: Job summary
        if: success() && steps.vercel_deploy.outputs.dashboard_url != ''
        shell: bash
        run: |
          {
            echo "## Vercel Dashboard"
            echo
            echo "- URL: ${{ steps.vercel_deploy.outputs.dashboard_url }}"
            echo "- GitHub Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Telegram success message
        if: success() && steps.vercel_deploy.outputs.dashboard_url != ''
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_FORCE_CHAT_ID }}
          DASHBOARD_URL: ${{ steps.vercel_deploy.outputs.dashboard_url }}
        run: |
          set +e

          TOKEN="${TELEGRAM_BOT_TOKEN_1:-${TELEGRAM_BOT_TOKEN_2:-}}"
          CHAT_ID="${TELEGRAM_CHAT_ID:-}"

          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ] || [ -z "$DASHBOARD_URL" ]; then
            echo "Telegram success message skipped."
            exit 0
          fi

          message="GPU dashboard hazir
          URL: $DASHBOARD_URL
          GitHub Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          curl -fsS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$message" >/dev/null || true

      - name: Telegram failure alert
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_FORCE_CHAT_ID }}
        run: |
          set +e

          TOKEN="${TELEGRAM_BOT_TOKEN_1:-${TELEGRAM_BOT_TOKEN_2:-}}"
          CHAT_ID="${TELEGRAM_CHAT_ID:-}"

          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram alert skipped: token/chat id missing."
            exit 0
          fi

          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log 2>/dev/null || true

          summary="$(grep -m 1 -E 'Error:|ERR!|Traceback|Exception|FATAL|KRITIK|CRITICAL|❌' failed.log || true)"
          if [ -z "$summary" ] && [ -f analyzer.log ]; then
            summary="$(grep -m 1 -E 'Error:|ERR!|Traceback|Exception|FATAL|KRITIK|CRITICAL|❌' analyzer.log || true)"
          fi
          if [ -z "$summary" ]; then
            summary="Ilk hata ozeti otomatik cikarilamadi; run logunu kontrol et."
          fi

          summary="${summary//$'\r'/ }"
          summary="${summary//$'\n'/ }"

          message="GPU analyzer alarmi
          Repo: $GITHUB_REPOSITORY
          Workflow: $GITHUB_WORKFLOW
          Run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Ozet: ${summary:0:700}"

          curl -fsS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$message" >/dev/null || true
